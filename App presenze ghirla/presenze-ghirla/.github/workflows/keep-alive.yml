name: Keep Supabase Alive

on:
  schedule:
    # Esegue la procedura ogni lunedì e giovedì alle 09:00 UTC
    - cron: '0 9 * * 1,4'
  workflow_dispatch: # Permette di avviare il workflow manualmente da GitHub Actions

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        run: |
          echo "Sending keep-alive request to Supabase presences table..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/presences?select=id&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}")
          
          echo "Response HTTP Status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Successfully pinged Supabase!"
          else
            echo "Failed to ping Supabase! Status code: $HTTP_STATUS"
            exit 1
          fi
